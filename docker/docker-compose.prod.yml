version: '3.8'

# Production deployment configuration for ShoPogoda
# Usage: docker-compose -f docker-compose.prod.yml up -d

services:
  # ShoPogoda Bot Application
  bot:
    image: ghcr.io/${GITHUB_REPOSITORY:-valpere/shopogoda}:${VERSION:-latest}
    container_name: shopogoda-bot-prod
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      # Override critical settings for production
      BOT_DEBUG: "false"
      LOG_LEVEL: "info"
      LOG_FORMAT: "json"
      DB_PATH: /app/data/shopogoda.db
    ports:
      - "${BOT_WEBHOOK_PORT:-8080}:8080"
    volumes:
      - bot_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - shopogoda-prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: shopogoda-prometheus-prod
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../deployments/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - shopogoda-prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: shopogoda-grafana-prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Grafana admin password required}
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-http://localhost:3000}
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ../deployments/grafana:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - shopogoda-prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Jaeger Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: shopogoda-jaeger-prod
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      COLLECTOR_OTLP_ENABLED: true
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
    volumes:
      - jaeger_data:/badger
    networks:
      - shopogoda-prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot_data:
    driver: local
    name: shopogoda_data_prod
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  jaeger_data:
    driver: local

networks:
  shopogoda-prod:
    driver: bridge
    name: shopogoda-prod-network
