# Optional observability stack. The bot itself needs no containers:
# it keeps its state in one SQLite file (DB_PATH, default ./data/shopogoda.db).
services:
  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: shopogoda-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../deployments/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: shopogoda-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana_data:/var/lib/grafana
      - ../deployments/grafana:/etc/grafana/provisioning
    depends_on:
      - prometheus

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: shopogoda-jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      COLLECTOR_OTLP_ENABLED: true

volumes:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: shopogoda-network
