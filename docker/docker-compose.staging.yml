version: '3.8'

# Staging deployment configuration for ShoPogoda
# Usage: docker-compose -f docker-compose.staging.yml up -d

services:
  # ShoPogoda Bot Application
  bot:
    image: ghcr.io/${GITHUB_REPOSITORY:-valpere/shopogoda}:${VERSION:-develop}
    container_name: shopogoda-bot-staging
    restart: unless-stopped
    env_file:
      - ../.env.staging
    environment:
      # Staging-specific settings
      BOT_DEBUG: "true"
      LOG_LEVEL: "debug"
      LOG_FORMAT: "json"
      DB_PATH: /app/data/shopogoda.db
    ports:
      - "${BOT_WEBHOOK_PORT:-8081}:8080"
    volumes:
      - bot_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - shopogoda-staging
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: shopogoda-prometheus-staging
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ../deployments/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - shopogoda-staging
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: shopogoda-grafana-staging
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-http://localhost:3001}
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ../deployments/grafana:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - shopogoda-staging
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  bot_data:
    driver: local
    name: shopogoda_data_staging
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  shopogoda-staging:
    driver: bridge
    name: shopogoda-staging-network
