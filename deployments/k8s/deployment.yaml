apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopogoda
  namespace: shopogoda
  labels:
    app: shopogoda
spec:
  # SQLite allows a single writer: exactly one replica, recreated (not rolled) on update
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shopogoda
  template:
    metadata:
      labels:
        app: shopogoda
    spec:
      # Image runs as uid/gid 10001 (docker/Dockerfile); fsGroup makes the PVC writable for SQLite
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: shopogoda
        image: shopogoda:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: shopogoda-config
        - secretRef:
            name: shopogoda-secrets
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /app/data
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: shopogoda-data
